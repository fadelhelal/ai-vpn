name: Build Windows Installer & Portable

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      NODE_VERSION: '20'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install OpenVPN (for bundling binaries)
        run: |
          # Download OpenVPN 2.6.12 MSI from GitHub releases (reliable)
          $version = "2.6.12"
          $url = "https://github.com/OpenVPN/openvpn/releases/download/v$version/OpenVPN-$version-I001-amd64.msi"
          $msi = "$env:TEMP\openvpn.msi"
          Write-Host "Downloading OpenVPN from GitHub releases..."
          try {
            Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing -ErrorAction Stop
          } catch {
            # Fallback to SourceForge
            Write-Host "GitHub download failed, trying SourceForge..."
            $sfUrl = "https://sourceforge.net/projects/openvpn/files/openvpn/$version/OpenVPN-$version-I001-amd64.msi/download"
            Invoke-WebRequest -Uri $sfUrl -OutFile $msi -UseBasicParsing -ErrorAction Stop
          }
          # Silent install to default location (C:\Program Files\OpenVPN\bin)
          Write-Host "Installing OpenVPN..."
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/quiet", "/norestart" -Wait -NoNewWindow
          # Verify installation
          $bin = "C:\Program Files\OpenVPN\bin\openvpn.exe"
          if (Test-Path $bin) {
            Write-Host "OpenVPN installed successfully at $bin"
            & $bin --version
          } else {
            Write-Error "OpenVPN installation failed"
            exit 1
          }

      - name: Install Inno Setup
        run: |
          # Download Inno Setup 6 from GitHub releases (reliable)
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6.3.1/innosetup-6.3.1.exe"
          $exe = "$env:TEMP\innosetup.exe"
          Write-Host "Downloading Inno Setup..."
          try {
            Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing -ErrorAction Stop
          } catch {
            # Fallback to official site
            Write-Host "GitHub download failed, trying official site..."
            $fallbackUrl = "https://jrsoftware.org/download.php/is.exe"
            Invoke-WebRequest -Uri $fallbackUrl -OutFile $exe -UseBasicParsing -ErrorAction Stop
          }
          # Silent install
          Write-Host "Installing Inno Setup..."
          Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -NoNewWindow
          # Add to PATH for this session
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup installed at $iscc"
            echo "$iscc" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Error "Inno Setup installation failed"
            exit 1
          }

      - name: Install npm dependencies
        run: npm ci

      - name: Build portable package (bundles OpenVPN binaries)
        run: npm run package

      - name: Build Inno Setup installer
        run: npm run package:installer

      - name: Verify outputs
        run: |
          $dist = "dist"
          $setup = Get-ChildItem "$dist\AI-VPN-Windows-*-Setup.exe" | Select-Object -First 1
          $portable = Get-ChildItem "$dist\AI-VPN-Windows-*-portable.zip" | Select-Object -First 1
          $sha256 = Get-ChildItem "$dist\*.sha256" | Select-Object -First 1

          if (-not $setup) { Write-Error "Setup.exe not found"; exit 1 }
          if (-not $portable) { Write-Error "portable.zip not found"; exit 1 }

          Write-Host "Setup: $($setup.FullName) - $([math]::Round($setup.Length/1MB, 1)) MB"
          Write-Host "Portable: $($portable.FullName) - $([math]::Round($portable.Length/1MB, 1)) MB"
          if ($sha256) { Write-Host "Checksum: $(Get-Content $sha256.FullName)" }

          # Verify OpenVPN is bundled in portable
          $temp = "$env:TEMP\verify-portable"
          Expand-Archive -Path $portable.FullName -DestinationPath $temp -Force
          $bundledOpenVpn = "$temp\AIVPN\resources\openvpn\openvpn.exe"
          if (Test-Path $bundledOpenVpn) {
            Write-Host "✓ OpenVPN bundled in portable: $bundledOpenVpn"
            & $bundledOpenVpn --version
          } else {
            Write-Error "OpenVPN NOT bundled in portable!"
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.sha }}
          path: |
            dist/AI-VPN-Windows-*-Setup.exe
            dist/AI-VPN-Windows-*-portable.zip
            dist/*.sha256
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AI-VPN-Windows-*-Setup.exe
            dist/AI-VPN-Windows-*-portable.zip
            dist/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}