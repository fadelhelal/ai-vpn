name: Build Windows Installer & Portable

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      NODE_VERSION: '22'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install OpenVPN via Chocolatey
        run: |
          Write-Host "Installing OpenVPN via Chocolatey..."
          choco install openvpn -y --version 2.6.12
          $bin = "C:\Program Files\OpenVPN\bin\openvpn.exe"
          if (Test-Path $bin) {
            Write-Host "OpenVPN installed at $bin"
            & $bin --version
          } else {
            Write-Error "OpenVPN not found after install"
            exit 1
          }

      - name: Install Inno Setup (direct download with curl)
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6.3.1/innosetup-6.3.1.exe"
          $exe = "$env:TEMP\innosetup.exe"
          Write-Host "Downloading Inno Setup with curl..."
          $result = curl.exe -L -f -s -S --retry 3 --retry-delay 5 -A "Mozilla/5.0" -o $exe $url
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Error "curl download failed with exit code $exitCode"
            exit 1
          }
          if (-not (Test-Path $exe)) {
            Write-Error "EXE file not found after download"
            exit 1
          }
          $sizeMB = [System.Math]::Round((Get-Item $exe).Length/1MB, 1)
          Write-Host "Downloaded $sizeMB MB"
          if ($sizeMB -lt 1) {
            Write-Error "Downloaded file too small ($sizeMB MB), likely an error page"
            Get-Content $exe -Raw | Write-Host
            exit 1
          }
          Write-Host "Installing Inno Setup..."
          $install = Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -NoNewWindow -PassThru
          if ($install.ExitCode -ne 0) {
            Write-Error "Inno Setup install failed with exit code $($install.ExitCode)"
            exit 1
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup installed at $iscc"
            echo "$iscc" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Error "Inno Setup not found after install"
            exit 1
          }

      - name: Install npm dependencies
        run: npm ci

      - name: Build portable package (bundles OpenVPN binaries)
        run: npm run package

      - name: Build Inno Setup installer
        run: npm run package:installer

      - name: Verify outputs
        run: |
          $dist = "dist"
          $setup = Get-ChildItem "$dist\AI-VPN-Windows-*-Setup.exe" | Select-Object -First 1
          $portable = Get-ChildItem "$dist\AI-VPN-Windows-*-portable.zip" | Select-Object -First 1
          $sha256 = Get-ChildItem "$dist\*.sha256" | Select-Object -First 1

          if (-not $setup) { Write-Error "Setup.exe not found"; exit 1 }
          if (-not $portable) { Write-Error "portable.zip not found"; exit 1 }

          Write-Host "Setup: $($setup.FullName) - $([math]::Round($setup.Length/1MB, 1)) MB"
          Write-Host "Portable: $($portable.FullName) - $([math]::Round($portable.Length/1MB, 1)) MB"
          if ($sha256) { Write-Host "Checksum: $(Get-Content $sha256.FullName)" }

          # Verify OpenVPN is bundled in portable
          $temp = "$env:TEMP\verify-portable"
          Expand-Archive -Path $portable.FullName -DestinationPath $temp -Force
          $bundledOpenVpn = "$temp\AIVPN\resources\openvpn\openvpn.exe"
          if (Test-Path $bundledOpenVpn) {
            Write-Host "✓ OpenVPN bundled in portable: $bundledOpenVpn"
            & $bundledOpenVpn --version
          } else {
            Write-Error "OpenVPN NOT bundled in portable!"
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.sha }}
          path: |
            dist/AI-VPN-Windows-*-Setup.exe
            dist/AI-VPN-Windows-*-portable.zip
            dist/*.sha256
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AI-VPN-Windows-*-Setup.exe
            dist/AI-VPN-Windows-*-portable.zip
            dist/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}